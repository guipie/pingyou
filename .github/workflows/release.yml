name: Pingyou Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ========================================
          # macOS
          # ========================================

          - name: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin

          - name: macOS x64
            platform: macos-latest
            target: x86_64-apple-darwin

          # ========================================
          # Windows
          # ========================================

          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc

          - name: Windows x86
            platform: windows-latest
            target: i686-pc-windows-msvc

          - name: Windows ARM64
            platform: windows-latest
            target: aarch64-pc-windows-msvc

          # ========================================
          # Linux
          # ========================================

          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:

      # ========================================
      # 1. Checkout
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ========================================
      # 2. Setup pnpm
      #
      # 必须在 setup-node 之前
      # 因为 setup-node 的 cache: pnpm
      # 需要先找到 pnpm 可执行文件
      # ========================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # ========================================
      # 3. Setup Node.js
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # ========================================
      # 4. Setup Rust
      # ========================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ========================================
      # 5. Linux dependencies
      # ========================================

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            xdg-utils

      # ========================================
      # 6. Linux ARM64 cross compiler
      # ========================================

      - name: Install ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      # ========================================
      # 7. Rust cache
      # ========================================

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            target

      # ========================================
      # 8. Install frontend dependencies
      # ========================================

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ========================================
      # 9. Build + Sign + GitHub Release
      # ========================================

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v0.6.2

        env:
          # ====================================
          # GitHub Release Token
          # ====================================

          GITHUB_TOKEN: ${{ github.token }}

          # ====================================
          # Tauri Updater Signer
          # ====================================

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          # ====================================
          # Release
          # ====================================

          tagName: ${{ github.ref_name }}

          releaseName: Pingyou ${{ github.ref_name }}

          releaseBody: |
            ## Pingyou ${{ github.ref_name }}

            See the assets below to download the installer.

          # 多平台构建期间不保持 Draft 直接发布
          releaseDraft: false

          # 正式 Release，而不是 prerelease
          prerelease: false

          # 当前平台对应的 Rust target
          args: --target ${{ matrix.target }}