[workspace]
resolver = "2"
members = [ "src-tauri" ]
# 内置（vendored）的第三方源码：只作为 path 依赖参与编译，
# 不作为 workspace 成员，避免它们的 dev-dependencies 污染本项目 Cargo.lock。
exclude = [
  "src-tauri/vendor",
  "src-tauri/vendor/*",
  "src-tauri/vendor/**",
]

[profile.release]
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
lto = true

[workspace.dependencies]
tauri = "2"
serde = "1"
serde_json = "1"
fs_extra = "1"
tauri-plugin = { version = "2", features = [ "build" ] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
tauri-plugin-custom-window = { path = "./src-tauri/src/plugins/window" }
tauri-plugin-admin-status = { path = "./src-tauri/src/plugins/admin-status" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
